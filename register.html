<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue App - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Vue App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sales.html">Sales</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="register.html">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5" id="app">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Register</h3>
                    </div>
                    <div class="card-body">

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>

                                <input type="text" v-model="full_name" class="form-control" placeholder="Enter your full name">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" v-model="email" class="form-control" placeholder="Enter your email">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>

                                <input type="tel" v-model="phone_number" class="form-control" placeholder="Enter phone number">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>

                                <input type="password" v-model="password" class="form-control" placeholder="Enter password">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" v-model="confirm_password" class="form-control" placeholder="Confirm password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" @click="register_user">
                                Register
                            </button>
                            <div class="alert alert-success" v-if="alertSuccessShow">
                                {{ alertMessage }}

                            </div>
                            <div class="alert alert-danger" v-if="alertDangerShow">

                                {{ alertMessage }}

                            </div>


                        </form>
                        <p class="text-center mt-3">
                            Already have an account?
                            <a href="login.html">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/2.2.0/vue.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.25.0/axios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        new Vue({
            el : "#app",
            data :{
                full_name:"",
                email :"",
                phone_number:"",
                password:"",
                confirm_password :"",
                alertMessage:"",
                alertSuccessShow:false,
                alertDangerShow:false
            },
            methods:{
                register_user(){
                    if (
                        this.full_name==="" || this.email==="" ||
                        this.phone_number==="" || this.password==="" || 
                        this.confirm_password===""){
                        this.alertDangerShow= true
                        this.alertSuccessShow=false
                        this.alertMessage="Ensure all fields are filled."
                        return
                    }
                    console.log("data to flask..");
                    axios.post(
                        "http://127.0.0.1:5000/register",
                        {
                            full_name:this.full_name,
                            email:this.email,
                            phone_number:this.phone_number,
                            password:this.password,
                            confirm_password:this.confirm_password
                        }
                    )
                    .then((response)=>{
                        this.alertDangerShow=false;
                        console.log(response.data)
                        this.alertSuccessShow=true;
                        this.alertMessage="User registered succesfully."
                        console.log(response.data.token)
                        localStorage.setItem("token",response.data.token)
                        window.location.href="index.html"
                    }
                    )
                    .catch((error)=>{
                        this.alertSuccessShow= false;
                        this.alertDangerShow= true;
                        this.alertMessage = error.response?.data?.message ||"Registration failed"
                    }
            )
            },
            mounted(){
                if (localStorage.getItem("token") !=null){
                    window.location.href="index.html";
                }
            }
            
            
            }
        })
    </script>

</body>

</html>
